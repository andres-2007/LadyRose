{# HU 19 CA 3: guía para medir la muñeca y el largo del cuello #}
<div class="guia-medidas">
  <figure>
    <svg viewBox="0 0 92 92" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M30 86V52c0-7 2-12 4-17l4-12c1-3 5-3 6 0l1 10 2-16c1-3 5-3 5 0l1 16 2-13c1-3 5-2 5 1l-1 16 3-8c1-2 5-1 4 2l-4 14c-2 6-2 12-2 16v25"/><ellipse cx="46" cy="66" rx="16.5" ry="4.5" stroke="#a14e5c" stroke-dasharray="3 3"/></g></svg>
    <figcaption><strong>Muñeca</strong>Rodea la muñeca con un hilo o una cinta métrica justo debajo del hueso. Mide el hilo y súmale 1 cm para que la pulsera quede cómoda.</figcaption>
  </figure>
  <figure>
    <svg viewBox="0 0 92 92" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="46" cy="22" r="13"/><path d="M38 34v8c-10 3-20 8-24 20M54 34v8c10 3 20 8 24 20"/><path d="M36 44c2 12 18 12 20 0" stroke="#a14e5c" stroke-dasharray="3 3"/><path d="M33 46c2 22 24 22 26 0" stroke="#a14e5c" stroke-dasharray="3 3" opacity=".55"/></g></svg>
    <figcaption><strong>Largo del cuello</strong>Pon un hilo alrededor del cuello y déjalo caer hasta donde quieres que llegue el collar. Ese largo es la medida.</figcaption>
  </figure>
  <table>
    <thead><tr><th>Pulseras</th><th>Muñeca</th><th>Collares</th><th>Cae en</th></tr></thead>
    <tbody>
      <tr><td>XS</td><td>13 a 14 cm</td><td>40 cm</td><td>Base del cuello</td></tr>
      <tr><td>S</td><td>15 a 16 cm</td><td>45 cm</td><td>Clavícula</td></tr>
      <tr><td>M</td><td>17 a 18 cm</td><td>50 cm</td><td>Debajo de la clavícula</td></tr>
      <tr><td>L</td><td>19 a 20 cm</td><td>60 cm</td><td>Pecho</td></tr>
    </tbody>
  </table>
  <p class="campo__ayuda">¿Tu medida no está? Hacemos tallas fuera de lo común: <a href="{% url 'cotizaciones:cotizar' %}">pídela aquí</a>.</p>
</div>
